    <style>
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
      }
      .icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 2.4s linear infinite;
      }
    </style>
  </head>
